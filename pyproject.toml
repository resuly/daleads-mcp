[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "daleads-mcp"
version = "0.4.0"
description = "Australian development application and property intelligence data for AI agents."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "httpx>=0.27,<1",
  "mcp>=1.27,<2",
]
authors = [
  { name = "Limon Tech" },
]
keywords = ["mcp", "property", "planning", "development-applications", "australia"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://daleads.com.au/api/"
Documentation = "https://daleads.com.au/api/"
Repository = "https://github.com/resuly/daleads-mcp"

[project.scripts]
daleads-mcp = "mcp_server:main"

[tool.setuptools]
py-modules = ["mcp_server"]
