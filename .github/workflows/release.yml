name: Publish Python package to PyPI

on:
  release:
    types: [published]

# Jobs receive no write access unless they opt in below.
permissions:
  contents: read

concurrency:
  group: pypi-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and verify distributions
    if: ${{ !github.event.release.draft && !github.event.release.prerelease }}
    runs-on: ubuntu-latest

    steps:
      - name: Check out the released tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0
          persist-credentials: false

      - name: Check out the canonical DA Leads provider contract
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: resuly/da_leads
          ref: main
          path: .provider/da_leads
          # Fine-grained PAT or GitHub App token scoped only to
          # resuly/da_leads:contents:read. The default token cannot read this
          # private sibling repository.
          token: ${{ secrets.DA_LEADS_READ_TOKEN }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Verify provider and consumer API contracts are identical
        run: >-
          python scripts/check_provider_contract.py
          --provider-repo .provider/da_leads

      - name: Verify release and MCP metadata
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'PY'
          import json
          import os
          import pathlib
          import re
          import subprocess
          import tomllib

          root = pathlib.Path.cwd()
          tag = os.environ["RELEASE_TAG"]
          if not re.fullmatch(r"v(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)", tag):
              raise SystemExit(f"release tag must be stable SemVer vX.Y.Z, got {tag!r}")

          version = tag[1:]
          project = tomllib.loads((root / "pyproject.toml").read_text())["project"]
          server = json.loads((root / "server.json").read_text())
          readme = (root / "README.md").read_text()
          registry_name = "io.github.resuly/daleads-mcp"

          checks = {
              "pyproject project name": (project["name"], "daleads-mcp"),
              "pyproject version": (project["version"], version),
              "server.json name": (server["name"], registry_name),
              "server.json version": (server["version"], version),
              "server.json package identifier": (
                  server["packages"][0]["identifier"],
                  project["name"],
              ),
              "server.json package version": (
                  server["packages"][0]["version"],
                  version,
              ),
              "server.json registry type": (
                  server["packages"][0]["registryType"],
                  "pypi",
              ),
              "server.json transport": (
                  server["packages"][0]["transport"]["type"],
                  "stdio",
              ),
          }
          for label, (actual, expected) in checks.items():
              if actual != expected:
                  raise SystemExit(f"{label}: expected {expected!r}, got {actual!r}")

          marker = re.search(r"<!--\s*mcp-name:\s*([^\s]+)\s*-->", readme)
          if not marker or marker.group(1) != registry_name:
              raise SystemExit(
                  "README mcp-name marker must exactly match server.json name: "
                  f"{registry_name}"
              )

          subprocess.run(
              ["git", "merge-base", "--is-ancestor", "HEAD", "origin/main"],
              check=True,
          )
          PY

      - name: Verify Contamination provider and MCP contracts are identical
        run: >-
          python scripts/check_contamination_contract.py
          --provider-repo .provider/da_leads

      - name: Install build verification tools
        run: >-
          python -m pip install
          .
          build==1.5.0
          pytest==9.0.2
          twine==7.0.0

      - name: Run tests
        run: python -m pytest -q

      - name: Build wheel and source distribution
        run: python -m build

      - name: Check distribution metadata and README rendering
        run: python -m twine check --strict dist/*

      - name: Store verified distributions
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish verified distributions to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/daleads-mcp
    permissions:
      id-token: write

    # Keep the OIDC-capable job to artifact retrieval and publication only.
    steps:
      - name: Download verified distributions
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish distributions to PyPI with Trusted Publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
